[package]
name = "voice-button"
version = "0.5.0"
edition = "2021"
description = "Offline voice-to-text in the Windows tray"
license = "MIT"
repository = "https://github.com/machine202502/voice-button"
homepage = "https://machine202502.github.io/voice-button/"

[lib]
name = "voice_button"
path = "src/lib.rs"

[[bin]]
name = "voice-button"
path = "src/main.rs"

[[bin]]
name = "voice-button-ui"
path = "src/ui_main.rs"

[dependencies]
# A listening socket that can be rebound while Windows still holds the old
# connections in TIME_WAIT; std::net does not expose SO_REUSEADDR.
socket2 = "0.4"
anyhow = "1"
chrono = "0.4"
cpal = "0.15"
dirs = "5"
eframe = "0.27"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.19"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac"] }
ureq = "2"
whisper-rs = { version = "0.16", features = ["vulkan"] }
arboard = "3"
winreg = "0.56"
winit = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Globalization"] }
sherpa-onnx = { version = "2", default-features = false, features = ["shared"] }
# The phone talks to the app over HTTPS: browsers refuse microphone access on
# plain HTTP. Certificates are generated locally, so no CA is involved.
# The authority is reloaded from its own PEM files, which needs the parser.
rcgen = { version = "0.11", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"
# Addresses of the machine: the certificate and the QR code need them.
if-addrs = "0.13"
getrandom = "0.2"
qrcode = { version = "0.14", default-features = false }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Test-only: decodes the MP3 dictation asset for the end-to-end tests.
symphonia = { version = "0.5", default-features = false, features = ["mpa"] }

[profile.release]
lto = "thin"
