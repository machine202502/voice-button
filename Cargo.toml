[package]
name = "voice-button"
version = "0.2.4"
edition = "2021"
description = "Offline voice-to-text in the Windows tray"
license = "MIT"
repository = "https://github.com/machine202502/voice-button"
homepage = "https://machine202502.github.io/voice-button/"

[lib]
name = "voice_button"
path = "src/lib.rs"

[[bin]]
name = "voice-button"
path = "src/main.rs"

[[bin]]
name = "voice-button-ui"
path = "src/ui_main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
cpal = "0.15"
dirs = "5"
eframe = "0.27"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.19"
ureq = "2"
whisper-rs = { version = "0.16", features = ["vulkan"] }
arboard = "3"
winreg = "0.56"
winit = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
sherpa-onnx = { version = "2", default-features = false, features = ["shared"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
