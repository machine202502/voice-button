name: Release

on:
  push:
    branches: [master]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # An existing release is never rebuilt.
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A manual run publishes the version that is in the tree. Without this,
          # a version whose bump already landed but never turned into a release
          # (v0.6.0 sat in Cargo.toml with a local build only) could not be
          # published at all: the automatic gate only fires on a version change.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            previous=$(git show HEAD^:Cargo.toml | awk -F'"' '/^version[[:space:]]*=/{print $2; exit}')
          else
            previous=""
          fi
          if [ "$version" = "$previous" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          stripdown: true
          cache: true
      - name: Test
        run: cargo test --release --lib --bins
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      # scripts/web.ps1 builds the phone page and needs pnpm; the Windows runner
      # ships Node and npm, not pnpm, and the release used to die there.
      - name: Install pnpm
        run: npm install --global pnpm
      - name: Package and publish
        shell: pwsh
        run: ./scripts/publish.ps1 -Tag "v${{ needs.version.outputs.version }}"

