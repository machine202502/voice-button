<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111713">
<title>Voice Button</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  main.sheet-page { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  main.sheet-page h1 { font-size: 1.35em; margin-bottom: .5em; }
  main.sheet-page h2 { font-size: 1.05em; margin: 1.2em 0 .4em; }
  main.sheet-page p, main.sheet-page li { color: #cfe0c6; line-height: 1.55; }
  main.sheet-page ol { padding-left: 1.2em; }
  main.sheet-page li { margin-bottom: .45em; }
  main.sheet-page code { color: #c7f36b; word-break: break-all; }
  .big { display: block; text-align: center; background: #c7f36b; color: #17200f; font-weight: 600;
         border-radius: 14px; padding: 14px; margin: 18px 0; text-decoration: none; }
  .note { border: 1px solid rgba(255, 189, 98, .4); background: rgba(255, 189, 98, .08);
          border-radius: 14px; padding: 12px 14px; font-size: 13.5px; color: #ffd39b; }
  .lang { display: none; }
  .lang.on { display: block; }
</style>
</head>
<body>
<main class="sheet-page">

  <div id="install-guide"></div>

</main>
<script>
  // The guide is content from `lang/install.<code>.json`, so a new language is
  // a new file, never a new block in this HTML.
  const guide = document.getElementById('install-guide');
  fetch('/site/api/ping')
    .then((response) => response.json())
    .then((info) => {
      const lang = (info && info.lang) || 'en';
      return fetch('lang/install.' + lang + '.json')
        .then((response) => (response.ok ? response.json() : Promise.reject()))
        .catch(() => fetch('lang/install.en.json').then((response) => response.json()))
        .then((data) => {
          guide.innerHTML = data.html;
          document.documentElement.lang = lang;
          if (data.title) document.title = data.title;
          const note = document.getElementById('brave-note');
          if (note && /Brave/i.test(navigator.userAgent)) note.hidden = false;
        });
    })
    .catch(() => {});
</script>
</body>
</html>
